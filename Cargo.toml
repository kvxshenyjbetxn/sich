[workspace]
members = ["crates/*", "tools/*"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.26"

[workspace.dependencies]
gpui-kit = "=0.10.0"
alacritty_terminal = "=0.26.0"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "io-util"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
bytes = "1"
interprocess = { version = "2", features = ["tokio"] }
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard ={ version = "1", features = ["use-std"] }
async-channel = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
dirs = "6"
anyhow = "1"
thiserror = "2"
parking_lot = "0.12"
log = "0.4"

sich-proto = { path = "crates/proto" }
sich-daemon = { path = "crates/daemon" }
sich-term = { path = "crates/term" }
sich-hooks = { path = "crates/hooks" }
sich-git = { path = "crates/git" }
sich-orch = { path = "crates/orch" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
