[package]
name = "sich-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "sich"
path = "src/main.rs"

[[bin]]
name = "sich-cli"
path = "src/bin/sich_cli.rs"

[dependencies]
sich-proto.workspace = true
sich-daemon.workspace = true
sich-term.workspace = true
sich-hooks.workspace = true
sich-git.workspace = true
sich-orch.workspace = true
gpui-kit.workspace = true
alacritty_terminal.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
interprocess.workspace = true
async-channel.workspace = true
anyhow.workspace = true
parking_lot.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
regex = "1"
serde.workspace = true
serde_json = "1"
dirs.workspace = true
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
sys-locale = "0.3"
dunce = "1"
sysinfo = { version = "0.31", default-features = false, features = ["system"] }
ureq = "2"
semver = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
tray-icon = { version = "0.26", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
serde-saphyr = "1"
