[package]
name = "sich-remote-app"
version = "0.1.45"
edition = "2024"
description = "Sich phone app (Tauri 2)"

# Own workspace: mobile/ is not part of the root cargo workspace.
[workspace]

[lib]
name = "sich_remote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sich-remote-proto = { path = "../../crates/remote-proto", features = ["tokio"] }
iroh = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "io-util"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
bytes = "1"
anyhow = "1"
thiserror = "2"
base64 = "0.22"
tracing = "0.1"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
tempfile = "3"
